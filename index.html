<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khaṭṭ — Levantinisch schreiben</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D5C70">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F2ECE1; --card:#FBF8F2; --ink:#1E1A15; --muted:#6F665B; --line:#E4DACA; --line2:#CDBFA9;
  --accent:#1D5C70; --accent-ink:#FFFFFF; --accent-soft:#DCE8EB; --red:#B23A2B; --red-soft:#F5E0DB;
  --green:#2E7A4D; --green-soft:#DDEEE2; --gold:#B07E22; --guide:rgba(30,26,21,.11); --gguide:rgba(30,26,21,.15); --wguide:rgba(30,26,21,.22); --base:rgba(29,92,112,.38);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ar:"Noto Naskh Arabic","Geeza Pro","Noto Naskh Arabic UI","Arabic Typesetting","Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#161411; --card:#211E1A; --ink:#EEE7DA; --muted:#A79D8F; --line:#332E28; --line2:#4A423A;
  --accent:#86BFD1; --accent-ink:#0E2128; --accent-soft:#1F3238; --red:#E58372; --red-soft:#3B2420;
  --green:#7DC897; --green-soft:#1D3226; --gold:#D9AE5A; --guide:rgba(238,231,218,.13); --gguide:rgba(238,231,218,.17); --wguide:rgba(238,231,218,.25); --base:rgba(134,191,209,.45); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh}
h1,h2,h3,.sans,button,.tabs,.label,.pill{font-family:var(--sans)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:16px}
p{margin:.35em 0}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.muted{color:var(--muted)}
.small{font-size:14px}
#app{max-width:560px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .ar{font-size:30px;line-height:1}
.brand b{font-family:var(--sans);font-size:18px;font-weight:600}
.topstat{font-family:var(--sans);font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;cursor:pointer}
.tabs button .ar{font-size:20px;line-height:1.3}
.tabs button.on{color:var(--accent);font-weight:600}
body.in-session .tabs, body.in-session .top{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{margin-bottom:4px}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:500;padding:11px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:10px 10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.spacer{flex:1}
.hero{display:flex;gap:16px;align-items:center}
.hero .glyph{font-size:76px;line-height:1.5;min-width:86px;text-align:center;background:var(--paper);border-radius:12px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;direction:rtl}
.tile{direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 2px 7px;text-align:center;cursor:pointer;position:relative;color:var(--ink)}
.tile .ar{font-size:30px;line-height:1.75;display:block}
.tile .nm{font-family:var(--sans);font-size:11px;color:var(--muted);display:block;margin-top:-4px}
.tile .st{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:var(--line)}
.tile .st i{display:block;height:100%;border-radius:2px;background:var(--green)}
.tile.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tile.locked{opacity:.42}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sechead h3{font-size:15px}
/* session */
.sess-head{position:sticky;top:0;z-index:4;background:var(--paper);display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.sess-head .x{width:40px;height:40px;border-radius:20px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.sess-head .bar{flex:1}
.sess-head .cnt{font-family:var(--sans);font-size:13px;color:var(--muted);min-width:36px;text-align:right}
.prompt{margin:4px 0 10px}
.prompt h2{font-size:21px}
.prompt .ar{font-size:26px}
.pad-wrap{display:flex;justify-content:center;margin:6px 0}
canvas.pad{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.feedback{font-family:var(--sans);font-size:15px;min-height:46px;padding:10px 12px;border-radius:12px;margin:8px 0;display:flex;align-items:center;gap:8px}
.feedback:empty{background:transparent;padding:0;min-height:46px}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.bad{background:var(--red-soft);color:var(--red)}
.feedback.info{background:var(--accent-soft);color:var(--accent)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.forms div{background:var(--paper);border-radius:10px;text-align:center;padding:2px 2px 6px}
.forms .ar{font-size:30px;display:block;line-height:1.8}
.forms .label{font-size:10px}
.forms.pick button{appearance:none;border:1.5px solid transparent;background:var(--paper);border-radius:10px;text-align:center;padding:2px 2px 6px;cursor:pointer;color:var(--ink);font:inherit}
.forms.pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.forms.pick .ar{font-size:30px;display:block;line-height:1.8}
.formtag{display:inline-block;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 9px;margin:6px 0 2px}
.formtag .muted{font-weight:400}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{appearance:none;background:var(--card);border:1.5px solid var(--line2);border-radius:14px;padding:10px;min-height:66px;font-family:var(--sans);font-size:16px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.opt .ar{font-size:40px;line-height:1.6}
.opt .sub{font-size:12px;color:var(--muted)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.bigq{text-align:center;margin:8px 0 4px}
.bigq .ar{font-size:84px;line-height:1.6}
.bigq .en{font-family:var(--sans);font-size:24px;font-weight:600}
.speak{width:40px;height:40px;border-radius:20px;border:1px solid var(--line2);background:var(--card);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.speak svg{width:20px;height:20px}
.wordrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.wordrow:last-child{border-bottom:0}
.wordrow .ar{font-size:30px;line-height:1.6;min-width:92px;text-align:right}
.wordrow .en{flex:1}
.wordrow .en b{font-family:var(--sans);font-weight:500;font-size:15px;display:block}
.wordrow .en span{font-size:14px;color:var(--muted)}
.wordrow.locked{opacity:.45;cursor:default}
.check{font-family:var(--sans);color:var(--green);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;margin:6px 0}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 10px;direction:ltr;text-align:center}
.chip .ar{font-size:24px;line-height:1.7;display:block}
.chip .label{font-size:11px;margin-top:-6px;display:block;padding-bottom:3px;text-transform:none;letter-spacing:0}
.plus{font-family:var(--sans);color:var(--muted);align-self:center}
.center{text-align:center}
.result{font-family:var(--sans);font-size:44px;font-weight:600;text-align:center;margin:12px 0 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:14px;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;max-width:86vw;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tools{display:flex;gap:8px;justify-content:center;margin:2px 0}
.tools .btn{min-height:38px;padding:7px 12px;font-size:14px}
.stepdots{display:flex;gap:6px;justify-content:center;margin:4px 0 2px}
.stepdots i{width:8px;height:8px;border-radius:4px;background:var(--line2)}
.stepdots i.on{background:var(--accent)}
.stepdots i.done{background:var(--green)}
.list-plain{margin:6px 0;padding-left:18px}
.list-plain li{margin:3px 0}
.toggle{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:14px;color:var(--muted)}
.mistake{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.mistake .ar{font-size:28px;min-width:48px;text-align:center}
.seg{display:flex;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:15px;padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sound{padding:14px 16px}
.sound h3{font-size:15px;font-weight:600;margin:0 0 4px}
.sound p{margin:0;font-size:16px}
.sound .cmp{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.sound .cmp h3 .ar{font-size:22px;line-height:1;margin:0 2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair .w{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px}
.pair .w .t{flex:1;min-width:0}
.pair .w .ar{font-size:26px;line-height:1.5;display:block;text-align:left}
.pair .w .tr{font-family:var(--sans);font-size:13px;line-height:1.25}
.pair .w .en{font-size:13px;color:var(--muted);line-height:1.25}
.pair .speak{width:34px;height:34px}
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.grade-row.two{grid-template-columns:1fr 1fr}
.btn.grade{flex-direction:column;gap:0;padding:8px 4px;min-height:56px}
.btn.grade b{font-family:var(--sans);font-weight:600;font-size:15px}
.btn.grade span{font-family:var(--sans);font-size:12px;color:var(--muted)}
.btn.grade.g1{border-color:var(--red)} .btn.grade.g1 b{color:var(--red)}
.btn.grade.g3{border-color:var(--green)} .btn.grade.g3 b{color:var(--green)}
.pronbtn{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--accent);font-family:var(--sans);font-size:14px;font-weight:500;border-radius:999px;padding:7px 16px;margin:12px auto 0;cursor:pointer;display:table}
.pron{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 6px;margin:10px 0 4px;text-align:left}
.pron h4{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px;font-weight:600}
.pron .syl{font-family:var(--sans);font-size:24px;text-align:center;margin:2px 0 4px;letter-spacing:.02em}
.pron .syl b{color:var(--accent);font-weight:700}
.pron .syl i{font-style:normal;color:var(--line2);margin:0 3px}
.pron p,.pron li{font-family:var(--serif);font-size:15px;line-height:1.45;margin:0 0 8px}
.pron ul{margin:0;padding:0 0 0 18px}
.pron .small{font-size:13px;color:var(--muted)}
.pron .arin{font-family:var(--ar);font-size:1.15em;line-height:1}
.pchips{display:flex;flex-wrap:wrap;gap:5px;direction:rtl;justify-content:center;margin:4px 0 6px}
.pc{display:flex;flex-direction:column;align-items:center;min-width:38px;padding:2px 6px 5px;border:1px solid var(--line);border-radius:10px;background:var(--paper);direction:ltr}
.pc .pa{font-family:var(--ar);font-size:26px;line-height:1.5;min-height:39px}
.pc .pl{font-family:var(--sans);font-size:15px;font-weight:600}
.pc.un{border-style:dashed;border-color:var(--line2);background:transparent}
.pc.un .pl{color:var(--accent)}
.pc.sil .pl{color:var(--muted);font-weight:400}
.pc.gem .pl{color:var(--gold)}
.xrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 0}
.xrow .pronbtn{margin:0;display:inline-block}
.ftab{width:100%;border-collapse:collapse;margin:2px 0 10px}
.ftab th,.ftab td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.ftab thead th{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.ftab tbody th{text-align:left;font-family:var(--sans);font-weight:600;font-size:14px;white-space:nowrap}
.ftab .pn{display:block}.ftab .pg{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ftab .ar{font-size:23px;line-height:1.55}
.ftab .fl{font-family:var(--sans);font-size:14px}
.ftab td.tap{cursor:pointer}
b.af{color:var(--accent);font-weight:700}
.ar b.af{font-weight:inherit}
.fcue{font-family:var(--sans);font-size:17px;margin-top:10px;color:var(--accent);font-weight:600}
.fbase{margin-top:10px;color:var(--muted);font-family:var(--sans);font-size:15px}
.fbase .ar{font-size:26px;color:var(--ink)}
.fans .ar{font-size:46px;line-height:1.5}
.fans .fl{font-family:var(--sans);font-size:21px;display:block;margin-top:2px}
.fpat{font-family:var(--sans);font-size:14px;color:var(--muted);margin-top:8px}
.fopts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.fopts button{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--muted);font-family:var(--sans);font-size:14px;border-radius:999px;padding:6px 12px;cursor:pointer}
.fopts button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.fbuilt{display:flex;justify-content:center;gap:4px;margin:14px 0 6px;font-family:var(--sans);font-size:24px;font-weight:600}
.fslot{border-bottom:2px solid var(--line2);min-width:34px;text-align:center;padding:0 4px}
.fslot.aff{color:var(--accent)}.fslot.empty{color:var(--line2)}
.frow{margin:8px 0}.frl{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.fopts.tiles{margin:0}.fopts.tiles button{font-size:17px;padding:8px 14px;color:var(--ink);min-width:44px}
.fopts.tiles button:disabled{opacity:.55}
.fres{font-family:var(--sans);font-weight:700;font-size:15px;text-align:center;margin-top:12px;text-transform:uppercase;letter-spacing:.05em}
.fres.ok{color:var(--good,#2e7d4f)}.fres.bad{color:var(--bad,#b23a2b)}
.fex{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.fex .ar{font-size:26px}.fex .fl{font-family:var(--sans);font-size:16px}
.fstat{display:flex;gap:18px;margin:4px 0 8px}.fstat div{display:flex;flex-direction:column}.fstat b{font-family:var(--sans);font-size:26px}.fstat span{font-family:var(--sans);font-size:12px;color:var(--muted)}
.sbans{display:flex;flex-wrap:wrap;gap:6px;min-height:76px;padding:8px;border:1.5px dashed var(--line2);border-radius:var(--r);margin:12px 0 10px;align-items:center;justify-content:flex-start}
.sbph{font-family:var(--sans);font-size:14px;color:var(--muted);direction:ltr}
.sbbank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sbt{appearance:none;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:2px 10px 6px;cursor:pointer;color:var(--ink)}
.sbt .ar{font-size:26px;line-height:1.55}.sbt .sbl{font-family:var(--sans);font-size:13px;color:var(--muted);direction:ltr}
.sbfull{font-size:34px;line-height:1.6}.sbfl{font-family:var(--sans);font-size:18px;margin-top:2px}
.bsbox p{margin-bottom:8px}
.bsrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 10px}
.bsparts{display:flex;gap:3px}
.bsp{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:3px 8px;background:var(--paper)}
.bsp b{font-family:var(--sans);font-size:17px}.bsp small{font-family:var(--sans);font-size:11px;color:var(--muted)}
.bsp.af b{color:var(--accent)}.bsp.bb b{color:var(--gold)}
.bsres{font-family:var(--sans);font-size:15px}
.topic{font-family:ui-monospace,monospace;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;user-select:all;word-break:break-all}
.timein{font-family:var(--sans);font-size:17px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink)}
ol.steps{padding-left:20px;margin:6px 0 10px}ol.steps li{font-family:var(--serif);font-size:15px;margin-bottom:6px}
.trchip{appearance:none;border:1px dashed var(--line2);background:transparent;color:var(--muted);font-family:var(--sans);font-size:13px;border-radius:999px;padding:5px 14px;margin:8px auto 0;cursor:pointer;display:table}
.trshown{margin-top:4px}
.chip .label.hidename{visibility:hidden}
.disabled-note{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="ar" lang="ar">خطّ</span><b>Khaṭṭ</b></div>
    <div class="topstat" id="topstat"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="alphabet"><span class="ar" lang="ar">أ ب ت</span>Alphabet</button>
  <button data-tab="practice"><span class="ar" lang="ar">تمرين</span>Practice</button>
  <button data-tab="words"><span class="ar" lang="ar">كلمات</span>Words</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>

const view=document.getElementById('view');
let session=null;
function startSession({title,steps,onFinish,showCount=true}){
  document.body.classList.add('in-session'); window.scrollTo(0,0);
  const bar=h('i',{style:'width:0%'}); const cnt=h('span',{class:'cnt'});
  const body=h('div',{class:'sess-body'});
  const close=()=>{ endSession(); };
  view.replaceChildren(h('div',{class:'sess-head'}, h('button',{class:'x','aria-label':'Close',onclick:close},'✕'), h('div',{class:'bar'},bar), cnt), body);
  const S={i:0,steps,results:[],body,title};
  session=S;
  const show=()=>{ if(session!==S) return; const total=S.steps.length; bar.style.width=Math.round(100*S.i/total)+'%'; cnt.textContent=showCount?`${Math.min(S.i+1,total)}/${total}`:''; body.replaceChildren(); window.scrollTo(0,0);
    if(S.i>=total){ bar.style.width='100%'; cnt.textContent=''; if(onFinish) onFinish(body,S.results); else endSession(); return; }
    S.steps[S.i](body,{next:(r)=>{ S.results.push(r); S.i++; show(); }, index:S.i, total}); };
  S.show=show; show(); return S;
}

/* ---------- lesson ---------- */
function startLesson(L){
  const before=new Set(unlockedWords().map(w=>w.ar));
  let totalMistakes=0, memOk=true;

  const keys=L.formKeys; const many=keys.length>1;
  const steps=[ stepMeet(L),
    ...keys.map(k=>stepTrace(L.V[k],1,{phase:many?'Trace · every form':'Trace',onDone:m=>totalMistakes+=m})),
    ...(many?[]:[stepTrace(L,2,{onDone:m=>totalMistakes+=m})]),
    ...mixedForms(keys).map(k=>stepTrace(L.V[k],3,{phase:many?'Copy · mixed forms':'Copy',onDone:m=>totalMistakes+=m})),
    ...mixedForms(keys).map(k=>stepMemory(L.V[k],{label:many?'From memory · mixed forms':'From memory',onResult:(ok,t)=>{ if(!(ok&&t===1)) memOk=false; }})),
    qGlyphFromName(L,pool,{k:keys[(Math.random()*keys.length)|0]}), many?qFormPick(L,pool):qNameFromGlyph(L,pool) ];

    const q=memOk?(totalMistakes<=1?3:2):1; markLearned(L.id,q);

    const nx=nextLetter();
    box.append(h('div',{class:'center',style:'margin-top:20px'}, h('div',{class:'label'},'Learned'), h('div',{class:'bigq'},ar(L.ch)), h('h2',null,L.name),
      h('p',{class:'muted'}, `${learnedLetters().filter(x=>!x.extra).length} of 28 letters learned`)));
    if(fresh.length){ box.append(h('div',{class:'card'}, h('h3',null,fresh.length===1?'New word unlocked':`${fresh.length} new words unlocked`), fresh.slice(0,6).map(w=>wordRow(w,()=>{endSession();startWordLesson(w);})))); }
    box.append(h('div',{class:'row',style:'margin-top:14px'},
      nx? h('button',{class:'btn primary wide',onclick:()=>startLesson(nx)},`Next letter: `,ar(nx.ch),' ',nx.name):null,
      h('button',{class:'btn wide',onclick:endSession},'Back to the alphabet')));
  }});
}
